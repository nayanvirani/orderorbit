query CartTransformRunInput($boxCollections: [ID!]! = []) {
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      bundle: attribute(key: "_oo_bundle") {
        value
      }
      version: attribute(key: "_oo_v") {
        value
      }
      gift: attribute(key: "_oo_gift") {
        value
      }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inCollections(ids: $boxCollections) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  cartTransform {
    metafield(namespace: "$app", key: "bundles") {
      jsonValue
    }
  }
}
