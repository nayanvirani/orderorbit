api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "orderorbit-bundles"
type = "function"
uid = "f787887f-e36b-4bdd-e1b6-fc87c7fea3b112a8bb7c"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart-transform-run"

  # Input variables (metafield $app:input): the collections that build-your-own boxes are filled
  # from, so membership is checked live at checkout.
  [extensions.input.variables]
  namespace = "$app"
  key = "input"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  [extensions.ui.paths]
  create = "/"
  details = "/"
