query CartInput($boxCollections: [ID!]! = []) {
  presentmentCurrencyRate
  cart {
    tests: attribute(key: "_oo_x") {
      value
    }
    lines {
      id
      quantity
      offer: attribute(key: "_oo_offer") {
        value
      }
      bundle: attribute(key: "_oo_bundle") {
        value
      }
      version: attribute(key: "_oo_v") {
        value
      }
      gift: attribute(key: "_oo_gift") {
        value
      }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            inCollections(ids: $boxCollections) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "offers") {
      jsonValue
    }
  }
}
